packages:
  - apps/api
  - apps/worker
  - tools/virtual-device

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - msgpackr-extract
  - prisma
allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  '@scarf/scarf': set this to true or false
