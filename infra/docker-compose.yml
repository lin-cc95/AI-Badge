services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ai_badge
      POSTGRES_USER: badge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U badge -d ai_badge]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

  redis:
    image: valkey/valkey:8.1.9-alpine3.24
    command: valkey-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-badge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes: [minio-data:/data]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in infra/.env}
      DEMO_USER_ID: ${DEMO_USER_ID:-user-demo}
      DEMO_NICKNAME: ${DEMO_NICKNAME:-内测玩家}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EXPOSE_METRICS: ${EXPOSE_METRICS:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATABASE_URL: postgresql://badge:${POSTGRES_PASSWORD}@postgres:5432/ai_badge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-badge}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ai-badge
    ports: [127.0.0.1:3000:3000]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      MODERATION_MODEL: ${MODERATION_MODEL:-}
    depends_on:
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  minio-data:
