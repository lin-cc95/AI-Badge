services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ai_badge
      POSTGRES_USER: badge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badge-local-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U badge -d ai_badge]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-badge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-secret}
    ports: [9000:9000, 9001:9001]
    volumes: [minio-data:/data]
  api:
    build: ../apps/api
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      DATABASE_URL: postgresql://badge:${POSTGRES_PASSWORD:-badge-local-only}@postgres:5432/ai_badge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-badge}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-local-secret}
      S3_BUCKET: ai-badge
    ports: [3000:3000]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ../apps/worker
    environment:
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
    depends_on:
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
