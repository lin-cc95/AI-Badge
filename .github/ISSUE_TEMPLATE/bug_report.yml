name: Bug report
description: 报告可复现的问题；安全漏洞请使用私密报告。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题不包含密钥、个人数据或安全利用细节。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际结果和期望结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options: [Flutter, API, Worker, Docker, Virtual device, Documentation]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Flutter/Node/Docker 版本；请先删除隐私信息。
