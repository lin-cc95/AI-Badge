version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node-production:
        dependency-type: production
      node-development:
        dependency-type: development
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
